<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} · Agent Platform</title>
    <meta
      name="description"
      content="Agent Platform — the open standard for AI-native business applications."
    />
    <meta name="theme-color" content="#0b1020" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{BASE}}assets/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{BASE}}">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">Agent Platform</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="{{BASE}}"{{NAV_SPEC}}>Spec</a>
          <a href="{{BASE}}roadmap/"{{NAV_ROADMAP}}>Roadmap</a>
          <a href="{{BASE}}contributing/"{{NAV_CONTRIBUTING}}>Contributing</a>
          <a
            class="nav-external"
            href="https://github.com/WEBX-PL/agent-platform"
            rel="noopener noreferrer"
            >GitHub</a
          >
        </nav>
      </div>
    </header>

    <main class="wrap">
      <article class="prose">{{CONTENT}}</article>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p>
          Apache 2.0 ·
          <a href="https://github.com/WEBX-PL/agent-platform"
            >WEBX-PL/agent-platform</a
          >
        </p>
        <p class="footer-note">
          An open standard for the AI-native front door of a business.
        </p>
      </div>
    </footer>

    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      mermaid.initialize({
        startOnLoad: true,
        theme: "dark",
        securityLevel: "loose",
        fontFamily: "IBM Plex Sans, system-ui, sans-serif",
      });
    </script>
  </body>
</html>
